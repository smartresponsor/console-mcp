# F30 opt-in Looping socket; separate from Network socket and existing OAuth TCP listener.
# Enable only after installing the F30 release and the reviewed tmpfiles policy.
[Service]
Environment=CONSOLE_MCP_LOOPING_TUNNEL_SOCKET=/run/console-mcp-looping/looping.sock
Environment=CONSOLE_MCP_LOOPING_TUNNEL_GID=1001
ReadWritePaths=/run/console-mcp-looping
