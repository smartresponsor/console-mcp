name: Reusable Security Scan
on:
  workflow_call:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Scan Git history for secrets
        uses: docker://ghcr.io/gitleaks/gitleaks:v8.30.1
        with:
          args: git --redact --verbose --no-banner --no-color .

  semgrep:
    name: semgrep
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.173.0
    steps:
      - uses: actions/checkout@v6
      - name: Static security analysis
        run: >-
          semgrep scan
          --config p/security-audit
          --metrics=off
          --error
          --exclude .git
          --exclude .venv
          --exclude vendor
          --exclude node_modules
          --exclude var
          --exclude dist
          --exclude build
          .
