name: Reusable Security Scan
on:
  workflow_call:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - name: Install Gitleaks
        run: go install github.com/gitleaks/gitleaks/v8@v8.30.1
      - name: Scan changed commits for secrets
        shell: bash
        run: |
          set -euo pipefail
          gitleaks="$(go env GOPATH)/bin/gitleaks"
          common=(--redact --verbose --no-banner --no-color)
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            "$gitleaks" git "${common[@]}" --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.sha }}" .
          elif [[ "${{ github.event_name }}" == "push" && "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            "$gitleaks" git "${common[@]}" --log-opts="${{ github.event.before }}..${{ github.sha }}" .
          else
            "$gitleaks" dir "${common[@]}" .
          fi

  semgrep:
    name: semgrep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Semgrep
        run: python -m pip install --disable-pip-version-check --no-input semgrep==1.173.0
      - name: Static security analysis
        shell: bash
        run: |
          set -euo pipefail
          args=(
            scan
            --config p/security-audit
            --metrics=off
            --error
            --exclude .git
            --exclude .venv
            --exclude vendor
            --exclude node_modules
            --exclude var
            --exclude dist
            --exclude build
          )
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            args+=(--baseline-commit "${{ github.event.pull_request.base.sha }}")
          elif [[ "${{ github.event_name }}" == "push" && "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            args+=(--baseline-commit "${{ github.event.before }}")
          fi
          python -m semgrep "${args[@]}" .
