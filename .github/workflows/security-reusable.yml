name: Reusable Security Scan
on:
  workflow_call:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - name: Install Gitleaks
        run: go install github.com/gitleaks/gitleaks/v8@v8.30.1
      - name: Scan Git history for secrets
        run: '"$(go env GOPATH)/bin/gitleaks" git --redact --verbose --no-banner --no-color .'

  semgrep:
    name: semgrep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Semgrep
        run: python -m pip install --disable-pip-version-check --no-input semgrep==1.173.0
      - name: Static security analysis
        run: >-
          python -m semgrep scan
          --config p/security-audit
          --metrics=off
          --error
          --exclude .git
          --exclude .venv
          --exclude vendor
          --exclude node_modules
          --exclude var
          --exclude dist
          --exclude build
          .
