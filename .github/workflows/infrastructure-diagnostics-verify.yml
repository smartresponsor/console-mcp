name: Infrastructure diagnostics isolated validation

on:
  push:
    branches:
      - feature/infrastructure-diagnostics-capabilities
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostics-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Compile
        run: npm run build
      - name: Validate contract schemas
        run: node tool/infrastructure-diagnostics-regression.mjs
