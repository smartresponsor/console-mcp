name: PowerShell runner cross-platform
on:
  pull_request:
    paths:
      - src/tool/powershell-script.ts
      - tool/powershell-script-platform-regression.mjs
      - package.json
      - package-lock.json
      - .github/workflows/powershell-runner-cross-platform.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runner-regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:powershell-platform
